name: Release plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Stage release assets
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css --title "NAS Vault $GITHUB_REF_NAME" --generate-notes
